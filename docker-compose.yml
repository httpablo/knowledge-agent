x-database-url: &database-url postgresql+asyncpg://app:app@db:5432/knowledge_agent

x-backend: &backend
  image: knowledge-agent-backend:local

x-app-runtime: &app-runtime
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    DATABASE_URL: *database-url
    REDIS_URL: redis://redis:6379/0
    STORAGE_ENDPOINT_URL: http://minio:9000
    STORAGE_ACCESS_KEY: minioadmin
    STORAGE_SECRET_KEY: minioadmin
    STORAGE_AUTO_CREATE_BUCKET: 'true'

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: knowledge_agent
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d knowledge_agent']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend
    build: ./backend
    command: ['alembic', 'upgrade', 'head']
    restart: 'no'
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: [*backend, *app-runtime]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    <<: [*backend, *app-runtime]
    command: ['celery', '-A', 'tasks.celery_app', 'worker', '--loglevel=info']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: knowledge-agent-frontend:local
    build: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
